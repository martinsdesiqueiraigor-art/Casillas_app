<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Offline — Casillas App</title>
  <link rel="stylesheet" href="./css/reset.css">
  <link rel="stylesheet" href="./css/variables.css">
  <link rel="stylesheet" href="./css/layout.css">
  <link rel="stylesheet" href="./css/components.css">
  <style>
    .offline-wrap {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      gap: 16px;
    }
    .offline-icon { font-size: 64px; }
    .offline-title { color: var(--accent-primary); font-size: 22px; font-weight: 700; }
    .offline-msg { color: var(--text-secondary); font-size: 15px; max-width: 320px; line-height: 1.5; }
  </style>
</head>
<body>
  <main class="offline-wrap">
    <div class="offline-icon" aria-hidden="true">⚙️</div>
    <h1 class="offline-title">Você está offline</h1>
    <p class="offline-msg">
      O Casillas App funciona offline. Mas a página solicitada ainda não foi
      armazenada em cache. Reconecte para baixá-la.
    </p>
    <button class="btn btn-primary" onclick="location.reload()">Tentar novamente</button>
  </main>
</body>
</html>
