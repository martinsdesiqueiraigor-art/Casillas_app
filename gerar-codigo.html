<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gerador de Código de Ativação — Casillas App</title>
  <link rel="stylesheet" href="./css/reset.css">
  <link rel="stylesheet" href="./css/variables.css">
  <link rel="stylesheet" href="./css/layout.css">
  <link rel="stylesheet" href="./css/components.css">
  <style>
    body {
      padding: 24px;
      max-width: 640px;
      margin: 0 auto;
      background: var(--bg-app);
      color: var(--text-primary);
      min-height: 100vh;
      font-family: var(--font-sans);
    }
    h1 { color: var(--accent-primary); font-size: 22px; margin-bottom: 8px; }
    .hint { color: var(--text-secondary); font-size: 13px; margin-bottom: 20px; line-height: 1.5; }
    .code-box {
      background: #010409;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 16px;
      font-family: var(--font-mono);
      font-size: 22px;
      letter-spacing: 3px;
      text-align: center;
      color: var(--accent-secondary);
      margin: 16px 0;
      user-select: all;
      word-break: break-all;
    }
    .label-sm { color: var(--text-secondary); font-size: 12px; margin-bottom: 4px; }
  </style>
</head>
<body>
  <h1>🔑 Gerador de Código de Ativação</h1>
  <p class="hint">
    Cole o <strong>ID do dispositivo</strong> do cliente para gerar o
    código de ativação no formato <code>XXXX-XXXX-XXXX-XXXX</code>.
  </p>

  <div class="input-group">
    <label for="device-id">Device ID</label>
    <div class="input-with-clear">
      <input id="device-id" class="input" type="text"
             placeholder="ex: a1b2c3d4e5f6..." autocomplete="off"
             spellcheck="false">
    </div>
  </div>

  <button id="btn-gerar" class="btn btn-primary" type="button">Gerar código</button>

  <div id="resultado" class="hidden">
    <div class="label-sm">Código de ativação:</div>
    <div id="codigo" class="code-box">—</div>
    <button id="btn-copiar" class="btn btn-secondary" type="button">📋 Copiar</button>
  </div>

  <script type="module">
    const SALT_SECRETO = 'CasillasApp_SALT_2026_!@#';

    async function sha256Hex(text) {
      const enc = new TextEncoder();
      const buf = await crypto.subtle.digest('SHA-256', enc.encode(text));
      return Array.from(new Uint8Array(buf))
        .map((b) => b.toString(16).padStart(2, '0'))
        .join('')
        .toUpperCase();
    }

    function formatCode(raw16) {
      const clean = raw16.replace(/[^0-9A-F]/gi, '').toUpperCase().slice(0, 16).padEnd(16, '0');
      return [
        clean.slice(0, 4),
        clean.slice(4, 8),
        clean.slice(8, 12),
        clean.slice(12, 16)
      ].join('-');
    }

    const input = document.getElementById('device-id');
    const btn = document.getElementById('btn-gerar');
    const resultado = document.getElementById('resultado');
    const codigoEl = document.getElementById('codigo');
    const btnCopiar = document.getElementById('btn-copiar');

    btn.addEventListener('click', async () => {
      const id = input.value.trim();
      if (!id) {
        alert('Informe o Device ID.');
        return;
      }
      const hash = await sha256Hex(id + SALT_SECRETO);
      const code = formatCode(hash.slice(0, 16));
      codigoEl.textContent = code;
      resultado.classList.remove('hidden');
    });

    btnCopiar.addEventListener('click', async () => {
      const txt = codigoEl.textContent;
      try {
        await navigator.clipboard.writeText(txt);
        alert('Código copiado!');
      } catch {
        alert('Não foi possível copiar.');
      }
    });
  </script>
</body>
</html>
